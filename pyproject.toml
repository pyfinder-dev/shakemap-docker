[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shakemap-docker-service"
version = "0.1.0"
description = "Host client and service wrapper for the supported ShakeMap Docker deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "fastapi",
  "python-multipart",
  "uvicorn[standard]",
]

[project.scripts]
shake-in-docker = "shakemap_service.cli:main"

[tool.setuptools.packages.find]
include = ["shakemap_service*"]

[tool.setuptools.package-data]
shakemap_service = ["data/*.json"]
